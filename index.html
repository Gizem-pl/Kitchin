<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="High-protein, gluten-free meal prep: cook from your fridge, batch 7 days, track macros.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mise">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#F8F3EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171310" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Mise · Meal Prep</title>
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <h1 id="title">Quick Cook</h1>
      <p id="subtitle"></p>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Main">
    <button type="button" data-act="tab" data-v="quick" class="on">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="14" r="6.5"/><path d="M16.5 14H22M8 3.5c0 1.5 1.2 1.5 1.2 3M11.5 3.5c0 1.5 1.2 1.5 1.2 3"/></svg>
      <span>Quick Cook</span>
    </button>
    <button type="button" data-act="tab" data-v="batch">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="8" height="7" rx="2"/><rect x="13" y="4" width="8" height="7" rx="2"/><rect x="3" y="13" width="8" height="7" rx="2"/><rect x="13" y="13" width="8" height="7" rx="2"/></svg>
      <span>Batch Prep</span>
    </button>
    <button type="button" data-act="tab" data-v="macros">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M6 20v-6M11 20V9M16 20v-9M21 4l-5 4-5-2-6 5"/></svg>
      <span>Macros</span>
    </button>
    <button type="button" data-act="tab" data-v="rules">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
      <span>Rules</span>
    </button>
  </nav>

  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Recipe" hidden>
    <div id="sheetBody" class="sheet-body"></div>
  </section>

  <section id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Import recipe or batch plan" hidden>
    <div id="modalBody" class="modal-card"></div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="empty">Mise needs JavaScript enabled.</p></noscript>
  <script type="module" src="ui.js"></script>
</body>
</html>
